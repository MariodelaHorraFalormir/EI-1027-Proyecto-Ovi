<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - OVI UJI</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
<div th:replace="~{layout/navbar :: main-nav}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<main class="container py-5">

    <section class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-sm border-0">
                <div class="card-body p-5">

                    <h1 class="text-danger mb-3"
                        th:text="${errorName != null ? errorName : 'Error'}">
                        Error
                    </h1>

                    <p class="lead"
                       th:text="${message != null ? message : 'Ha ocurrido un error en la aplicación.'}">
                        Ha ocurrido un error en la aplicación.
                    </p>

                    <div class="alert alert-warning mt-4" th:if="${path != null}">
                        <strong>Ruta:</strong>
                        <span th:text="${path}">/ruta</span>
                    </div>

                    <div class="alert alert-secondary mt-3" th:if="${status != null}">
                        <strong>Código:</strong>
                        <span th:text="${status}">500</span>
                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <a class="btn btn-primary" th:href="@{/}">
                            Volver al inicio
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </section>

</main>

</body>
</html>
