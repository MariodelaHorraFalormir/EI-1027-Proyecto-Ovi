<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de persona</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>

    <style>
        body {
            background: linear-gradient(135deg, #f4f7fb, #e9f0f8);
            min-height: 100vh;
        }

        .edit-card {
            max-width: 1100px;
            margin: 40px auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
            padding: 2rem;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1f3b5b;
            margin-bottom: 0.3rem;
        }

        .section-subtitle {
            color: #6c757d;
            margin-bottom: 2rem;
        }

        .block-card {
            background: #f8fafc;
            border: 1px solid #e9eef5;
            border-radius: 18px;
            padding: 1.4rem;
            margin-bottom: 1.5rem;
        }

        .block-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1f3b5b;
            margin-bottom: 1.2rem;
        }

        .data-label {
            font-weight: 600;
            color: #1f3b5b;
            margin-bottom: 0.45rem;
        }

        .form-control,
        .form-select {
            border-radius: 12px;
            padding: 0.75rem 0.95rem;
            border: 1px solid #d8e0ea;
            background-color: #fff;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #7aa7d9;
            box-shadow: 0 0 0 0.2rem rgba(58, 123, 213, 0.12);
        }

        .role-badge {
            display: inline-block;
            background: #6c7a89;
            color: white;
            font-weight: 600;
            border-radius: 999px;
            padding: 0.45rem 0.85rem;
            font-size: 0.9rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.8rem;
        }

        .actions {
            margin-top: 2rem;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn {
            border-radius: 12px;
            padding: 0.7rem 1.15rem;
            font-weight: 600;
        }

        .btn-primary {
            background-color: #1f4e79;
            border-color: #1f4e79;
        }

        .btn-primary:hover {
            background-color: #193f63;
            border-color: #193f63;
        }

        .btn-outline-secondary:hover {
            background-color: #6c757d;
            color: white;
        }

        .text-muted-small {
            font-size: 0.92rem;
            color: #6c757d;
        }

        .alert {
            border-radius: 14px;
        }

        .invalid-feedback {
            font-size: 0.88rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div th:replace="~{layout/navbar :: main-nav}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<div class="container">
    <div class="edit-card">

        <div class="top-bar">
            <div>
                <h1 class="section-title">Registro de persona</h1>
                <p class="section-subtitle mb-0">
                    Completa los datos para darte de alta en la plataforma OVI
                </p>
            </div>

            <span class="role-badge">Nueva alta</span>
        </div>

        <div th:if="${errorMail}" class="alert alert-danger" th:text="${errorMail}"></div>

        <form th:object="${persona}"
              method="post"
              th:action="@{/Persona/registro}"
              novalidate>

            <div class="alert alert-danger"
                 th:if="${#fields.hasAnyErrors()}">
                Revisa los campos marcados antes de completar el registro.
            </div>

            <!-- DATOS PERSONALES -->
            <div class="block-card">
                <div class="block-title">Datos personales</div>

                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="data-label" for="nombre">Nombre</label>
                        <input type="text"
                               id="nombre"
                               class="form-control"
                               th:field="*{nombre}"
                               th:errorclass="is-invalid"
                               placeholder="Introduce el nombre"
                               required>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('nombre')}"
                             th:errors="*{nombre}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="data-label" for="apellidos">Apellidos</label>
                        <input type="text"
                               id="apellidos"
                               class="form-control"
                               th:field="*{apellidos}"
                               th:errorclass="is-invalid"
                               placeholder="Introduce los apellidos"
                               required>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('apellidos')}"
                             th:errors="*{apellidos}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="data-label" for="mail">Correo electrónico</label>
                        <input type="email"
                               id="mail"
                               class="form-control"
                               th:field="*{mail}"
                               th:errorclass="is-invalid"
                               placeholder="correo@ejemplo.com"
                               required>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('mail')}"
                             th:errors="*{mail}">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="data-label" for="telefono">Teléfono</label>
                        <input type="text"
                               id="telefono"
                               class="form-control"
                               th:field="*{telefono}"
                               th:errorclass="is-invalid"
                               placeholder="600123123"
                               required>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('telefono')}"
                             th:errors="*{telefono}">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="data-label" for="dni">DNI</label>
                        <input type="text"
                               id="dni"
                               class="form-control"
                               th:field="*{dni}"
                               th:errorclass="is-invalid"
                               placeholder="12345678A"
                               required>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('dni')}"
                             th:errors="*{dni}">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="data-label" for="pais">País</label>
                        <input type="text"
                               id="pais"
                               class="form-control"
                               th:field="*{pais}"
                               th:errorclass="is-invalid"
                               placeholder="España"
                               required>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('pais')}"
                             th:errors="*{pais}">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="data-label" for="genero">Género</label>
                        <select id="genero"
                                class="form-select"
                                th:field="*{genero}"
                                th:errorclass="is-invalid"
                                required>
                            <option value="">Selecciona una opción</option>
                            <option value="Hombre">Hombre</option>
                            <option value="Mujer">Mujer</option>
                            <option value="Otro">Otro</option>
                        </select>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('genero')}"
                             th:errors="*{genero}">
                        </div>
                    </div>

                    <div class="col-md-8">
                        <label class="data-label" for="direccion">Dirección</label>
                        <input type="text"
                               id="direccion"
                               class="form-control"
                               th:field="*{direccion}"
                               th:errorclass="is-invalid"
                               placeholder="Calle, número, piso..."
                               required>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('direccion')}"
                             th:errors="*{direccion}">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="data-label" for="fechaNacimiento">Fecha de nacimiento</label>
                        <input type="date"
                               id="fechaNacimiento"
                               name="fechaNacimiento"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('fechaNacimiento')} ? ' is-invalid' : ''"
                               th:value="${persona.fechaNacimiento != null ? #temporals.format(persona.fechaNacimiento, 'yyyy-MM-dd') : ''}"
                               required>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('fechaNacimiento')}"
                             th:errors="*{fechaNacimiento}">
                        </div>
                    </div>
                </div>
            </div>

            <!-- PERSONALIDAD -->
            <div class="block-card">
                <div class="block-title">Personalidad</div>
                <p class="text-muted-small mb-3">
                    Introduce un valor del 1 al 10 en cada dimensión.
                </p>

                <div class="row g-4">
                    <div class="col-md-4">
                        <label class="data-label" for="ritmo">Ritmo</label>
                        <input type="number"
                               id="ritmo"
                               class="form-control"
                               th:field="*{personalidad.ritmo}"
                               th:errorclass="is-invalid"
                               min="1"
                               max="10"
                               step="1"
                               placeholder="1-10"
                               required>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('personalidad.ritmo')}"
                             th:errors="*{personalidad.ritmo}">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="data-label" for="comunicacion">Comunicación</label>
                        <input type="number"
                               id="comunicacion"
                               class="form-control"
                               th:field="*{personalidad.comunicacion}"
                               th:errorclass="is-invalid"
                               min="1"
                               max="10"
                               step="1"
                               placeholder="1-10"
                               required>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('personalidad.comunicacion')}"
                             th:errors="*{personalidad.comunicacion}">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="data-label" for="expresividad">Expresividad</label>
                        <input type="number"
                               id="expresividad"
                               class="form-control"
                               th:field="*{personalidad.expresividad}"
                               th:errorclass="is-invalid"
                               min="1"
                               max="10"
                               step="1"
                               placeholder="1-10"
                               required>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('personalidad.expresividad')}"
                             th:errors="*{personalidad.expresividad}">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="data-label" for="caracter">Carácter</label>
                        <input type="number"
                               id="caracter"
                               class="form-control"
                               th:field="*{personalidad.caracter}"
                               th:errorclass="is-invalid"
                               min="1"
                               max="10"
                               step="1"
                               placeholder="1-10"
                               required>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('personalidad.caracter')}"
                             th:errors="*{personalidad.caracter}">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="data-label" for="naturaleza">Naturaleza</label>
                        <input type="number"
                               id="naturaleza"
                               class="form-control"
                               th:field="*{personalidad.naturaleza}"
                               th:errorclass="is-invalid"
                               min="1"
                               max="10"
                               step="1"
                               placeholder="1-10"
                               required>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('personalidad.naturaleza')}"
                             th:errors="*{personalidad.naturaleza}">
                        </div>
                    </div>
                </div>
            </div>

            <!-- ACCESO -->
            <div class="block-card">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                    <div class="block-title mb-0">Acceso a la plataforma</div>
                    <span class="role-badge">Cuenta</span>
                </div>

                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="data-label" for="contrasena">Contraseña</label>
                        <input type="password"
                               id="contrasena"
                               class="form-control"
                               th:field="*{contrasena}"
                               th:errorclass="is-invalid"
                               placeholder="Introduce una contraseña"
                               required>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('contrasena')}"
                             th:errors="*{contrasena}">
                        </div>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">Registrarme</button>
                    <a th:href="@{/}" class="btn btn-secondary">Volver al inicio</a>
                    <a th:href="@{/Persona/listId}" class="btn btn-outline-secondary">Ver personas</a>
                </div>
            </div>

        </form>
    </div>
</div>

</body>
</html>
