<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Gestionar Diversidades Por Usuario</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />

    <style>
        body {
            background: linear-gradient(135deg, #f4f7fb, #e9f0f8);
            min-height: 100vh;
        }

        .page-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
            padding: 2rem;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1f3b5b;
            margin-bottom: 0.3rem;
        }

        .section-subtitle {
            color: #6c757d;
            margin-bottom: 1.5rem;
        }

        .tabla-wrapper {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 70vh;
            border: 1px solid #ddd;
            border-radius: 14px;
            background: white;
        }

        .tabla-personas {
            min-width: 900px;
            margin-bottom: 0;
        }

        .tabla-personas thead th {
            position: sticky;
            top: 0;
            background: #f8fafc;
            z-index: 2;
            color: #1f3b5b;
        }

        .no-wrap {
            white-space: nowrap;
        }

        .actions {
            margin-top: 1.5rem;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            border-radius: 12px;
            padding: 0.55rem 0.95rem;
            font-weight: 600;
        }

        .btn-sm {
            padding: 0.45rem 0.75rem;
            border-radius: 10px;
        }

        .btn-primary {
            background-color: #1f4e79;
            border-color: #1f4e79;
        }

        .btn-primary:hover {
            background-color: #193f63;
            border-color: #193f63;
        }
    </style>
</head>

<body>

<div th:replace="~{layout/navbar :: main-nav}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<main class="container-fluid mt-4 px-4">
    <div class="page-card">

        <h1 class="section-title">Diversidades funcionales por usuario</h1>

        <p class="section-subtitle">
            Gestiona las diversidades funcionales asociadas a este usuario.
        </p>

        <div class="tabla-wrapper mt-3">
            <table class="table table-striped table-hover align-middle tabla-personas">
                <thead>
                <tr>
                    <th class="no-wrap">ID</th>
                    <th class="no-wrap">OVI User</th>
                    <th class="no-wrap">Tipo</th>
                    <th class="no-wrap">Editar</th>
                    <th class="no-wrap">Borrar</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="diversidad : ${diversidades}">
                    <td th:text="${diversidad.idDiversidadFuncional}"></td>
                    <td th:text="${diversidad.oviUserId}"></td>
                    <td th:text="${diversidad.tipo}"></td>

                    <td class="no-wrap">
                        <a th:href="@{/DiversidadFuncional/update/{idDiversidad}
                            (idDiversidad=${diversidad.idDiversidadFuncional})}"
                           class="btn btn-warning btn-sm">
                            Editar
                        </a>
                    </td>

                    <td class="no-wrap">
                        <a th:href="@{/DiversidadFuncional/confirmDelete/{idDiversidad}/{idUsuario}
                            (idDiversidad=${diversidad.idDiversidadFuncional}, idUsuario=${id})}"
                           class="btn btn-danger btn-sm">
                            Borrar
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(diversidades)}">
                    <td colspan="5" class="text-center text-muted py-4">
                        Este usuario no tiene diversidades funcionales registradas.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${totalPages > 1}" class="d-flex justify-content-center mt-3">
            <nav>
                <ul class="pagination">

                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/DiversidadFuncional/listaID/{id}
                           (id=${id}, page=${currentPage - 1})}">
                            Anterior
                        </a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link"
                           th:href="@{/DiversidadFuncional/listaID/{id}
                           (id=${id}, page=${i})}"
                           th:text="${i + 1}">
                        </a>
                    </li>

                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/DiversidadFuncional/listaID/{id}
                           (id=${id}, page=${currentPage + 1})}">
                            Siguiente
                        </a>
                    </li>

                </ul>
            </nav>
        </div>

        <div class="actions">
            <a th:href="@{/DiversidadFuncional/create/{id}(id=${id})}"
               class="btn btn-success">
                Añadir nueva diversidad
            </a>

            <a th:href="@{/}"
               class="btn btn-secondary">
                Finalizar el proceso
            </a>
        </div>

    </div>
</main>

</body>
</html>
