
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Proceso PA Request</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
    <style>
        body { background: linear-gradient(135deg, #f4f7fb, #e9f0f8); min-height: 100vh; }
        .edit-card { max-width: 950px; margin: 40px auto; background: white; border-radius: 24px; box-shadow: 0 12px 35px rgba(0,0,0,0.08); padding: 2.5rem; }
        .section-title { font-size: 2rem; font-weight: 700; color: #1f3b5b; }
        .block-card { background: #f8fafc; border: 1px solid #e9eef5; border-radius: 18px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .block-title { font-size: 1.1rem; font-weight: 600; color: #4a5568; margin-bottom: 1rem; border-bottom: 2px solid #edf2f7; padding-bottom: 0.5rem; }
        .data-label { font-weight: 600; color: #1f3b5b; margin-bottom: 0.45rem; }
        .form-control, .form-select { border-radius: 12px; }
    </style>
</head>
<body>

<div th:replace="~{layout/navbar :: main-nav}"></div>

<div class="container">
    <div class="edit-card">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
            <div>
                <h1 class="section-title">Editar Proceso PA Request</h1>
                <p class="text-muted mb-0">Modifica los datos del proceso de asistencia personal</p>
            </div>
            <span class="badge text-bg-secondary fs-6" th:text="'ID ' + ${paRequest.id}"></span>
        </div>

        <form th:object="${paRequest}" th:action="@{/PaRequest/update/{id}(id=${paRequest.id})}" method="post">

            <input type="hidden" th:field="*{id}" />
            <input type="hidden" th:field="*{oviUser}" />
            <input type="hidden" th:field="*{fechaCreacion}" />

            <!-- Estado -->
            <div class="block-card">
                <div class="block-title">Estado del Proceso</div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="data-label">Estado</label>
                        <select th:field="*{status}" class="form-select">
                            <option value="En_espera">En espera</option>
                            <option value="En_activo">En activo</option>
                            <option value="Caducada">Caducada</option>
                            <option value="Finalizada">Finalizada</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="data-label">Fecha de resolución</label>
                        <input type="date" class="form-control"
                               name="fechaResolucion"
                               th:value="${paRequest.fechaResolucion != null ? #temporals.format(paRequest.fechaResolucion, 'yyyy-MM-dd') : ''}"/>
                    </div>
                </div>
            </div>

            <!-- Detalles del servicio -->
            <div class="block-card">
                <div class="block-title">Detalles del Servicio</div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="data-label">Fecha inicio</label>
                        <input type="date" class="form-control"
                               name="fechaInicio"
                               th:value="${paRequest.fechaInicio != null ? #temporals.format(paRequest.fechaInicio, 'yyyy-MM-dd') : ''}"/>
                    </div>
                    <div class="col-md-6">
                        <label class="data-label">Fecha fin</label>
                        <input type="date" class="form-control"
                               name="fechaFin"
                               th:value="${paRequest.fechaFin != null ? #temporals.format(paRequest.fechaFin, 'yyyy-MM-dd') : ''}"/>
                    </div>
                    <div class="col-md-12">
                        <label class="data-label">Tipo de asistencia</label>
                        <select th:field="*{tipoAsistencia}" class="form-select">
                            <option value="">Selecciona una opción...</option>
                            <option value="Movilidad">Apoyo a la movilidad</option>
                            <option value="Higiene">Higiene personal</option>
                            <option value="Acompañamiento">Acompañamiento académico</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Preferencias -->
            <div class="block-card">
                <div class="block-title">Preferencias</div>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="data-label">Género del asistente</label>
                        <select th:field="*{generoAsistente}" class="form-select">
                            <option value="Sin preferencia">Sin preferencia</option>
                            <option value="Hombre">Hombre</option>
                            <option value="Mujer">Mujer</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="data-label">Disponibilidad horaria</label>
                        <select th:field="*{disponibilidadHoraria}" class="form-select">
                            <option value="Flexible">Flexible</option>
                            <option value="Mañanas">Mañanas</option>
                            <option value="Tardes">Tardes</option>
                            <option value="Noches">Noches</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="data-label">Zona geográfica</label>
                        <select th:field="*{zonaGeografica}" class="form-select">
                            <option value="Sin preferencia">Sin preferencia</option>
                            <option value="Campus UJI">Campus UJI</option>
                            <option value="Centro ciudad">Centro ciudad</option>
                            <option value="Norte">Norte</option>
                            <option value="Sur">Sur</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="data-label">Preferencias adicionales</label>
                        <textarea th:field="*{preferencias}" class="form-control" rows="3"
                                  placeholder="Notas adicionales..."></textarea>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-3 justify-content-end mt-4">
                <a th:href="@{/PaRequest/detail/{id}(id=${paRequest.id})}" class="btn btn-outline-secondary px-4">Cancelar</a>
                <button type="submit" class="btn btn-primary px-5">Guardar cambios</button>
            </div>

        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
