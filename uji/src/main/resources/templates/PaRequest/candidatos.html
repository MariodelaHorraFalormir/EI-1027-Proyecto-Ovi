<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Candidatos Disponibles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">

<div th:replace="~{layout/navbar :: main-nav}"></div>

<div class="container mt-5">
    <h2 class="fw-bold mb-4">Candidatos Disponibles (PAP/PATI)</h2>
    <p class="text-muted">Selecciona el candidato que mejor se adapte a tu solicitud y empieza a negociar.</p>

    <div class="row">
        <div th:if="${candidatos.empty}" class="col-12">
            <div class="alert alert-warning shadow-sm">
                En este momento no hay candidatos activos disponibles en el sistema.
            </div>
        </div>

        <div th:each="cand : ${candidatos}" class="col-md-4 mb-4">
            <div class="card shadow-sm h-100 border-0" style="border-radius: 15px;">
                <div class="card-body">
                    <h5 class="card-title fw-bold text-primary mb-3">
                        👤 <span th:text="${cand.nombre}"></span> <span th:text="${cand.apellidos}"></span>
                    </h5>
                    <p class="card-text mb-1">
                        <strong>Experiencia:</strong> <span th:text="${cand.experiencia}"></span> años
                    </p>
                    <p class="card-text mb-4">
                        <strong>Disponibilidad:</strong>
                        <span class="badge bg-info text-dark" th:text="${cand.disponibilidad}"></span>
                    </p>

                    <a th:href="@{/chat/{idSol}/{idReceptor}(idSol=${idSolicitud}, idReceptor=${cand.id_candidato})}"
                       class="btn btn-success w-100 fw-bold rounded-pill">
                        💬 Hablar por Chat
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4 text-center">
        <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">Volver atrás</a>
    </div>
</div>

</body>
</html>
