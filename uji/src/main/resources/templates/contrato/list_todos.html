<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <title>Todos los Contratos</title>
  <meta charset="UTF-8" />
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
  <style>
    body { background: linear-gradient(135deg, #f4f7fb, #e9f0f8); min-height: 100vh; }
    .page-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 2rem; }
    .section-title { font-size: 2rem; font-weight: 800; color: #1f3b5b; }
    .no-wrap { white-space: nowrap; }
  </style>
</head>
<body>

<div th:replace="~{layout/navbar :: main-nav}"></div>

<main class="container-fluid mt-4 px-4 mb-5">
  <div class="page-card">

    <div class="mb-4">
      <h1 class="section-title">Todos los contratos</h1>
      <p class="text-muted mb-0">
        Listado completo de los contratos formados en la plataforma. Solo lectura.
      </p>
    </div>

    <div th:if="${#lists.isEmpty(contratos)}" class="alert alert-info">
      No hay contratos registrados.
    </div>

    <div th:if="${!#lists.isEmpty(contratos)}" class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
          <th class="no-wrap">ID</th>
          <th class="no-wrap">PA Request</th>
          <th class="no-wrap">Usuario OVI</th>
          <th class="no-wrap">PAP/PATI</th>
          <th class="no-wrap">Fecha inicio</th>
          <th class="no-wrap">Fecha fin</th>
          <th class="no-wrap">Estado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${contratos}">
          <td th:text="${c.id}"></td>
          <td th:text="${c.idSolicitud}"></td>
          <td th:text="${c.idUsuarioOvi}"></td>
          <td th:text="${c.idPapPati}"></td>
          <td class="no-wrap" th:text="${c.fechaInicio != null ? #temporals.format(c.fechaInicio, 'dd/MM/yyyy') : '-'}"></td>
          <td class="no-wrap" th:text="${c.fechaFin != null ? #temporals.format(c.fechaFin, 'dd/MM/yyyy') : '-'}"></td>
          <td>
                        <span class="badge"
                              th:classappend="${c.estado == 'Activo' ? 'text-bg-success' : 'text-bg-secondary'}"
                              th:text="${c.estado}"></span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div th:if="${totalPages > 1}" class="d-flex justify-content-center mt-3">
      <nav>
        <ul class="pagination">
          <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
            <a class="page-link" th:href="@{/contrato/list/todos(page=${currentPage - 1})}">Anterior</a>
          </li>
          <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
            <a class="page-link" th:href="@{/contrato/list/todos(page=${i})}" th:text="${i + 1}"></a>
          </li>
          <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
            <a class="page-link" th:href="@{/contrato/list/todos(page=${currentPage + 1})}">Siguiente</a>
          </li>
        </ul>
      </nav>
    </div>

    <div class="mt-3">
      <a th:href="@{/}" class="btn btn-secondary fw-bold px-4">Volver al inicio</a>
    </div>

  </div>
</main>

</body>
</html>
