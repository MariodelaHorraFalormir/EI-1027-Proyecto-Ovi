<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mis Contratos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">

<div th:replace="~{layout/navbar :: main-nav}"></div>

<div class="container mt-5 mb-5">
  <div class="card shadow-sm border-0" style="border-radius: 15px;">
    <div class="card-body p-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark mb-0">🤝 Mis Contratos Registrados</h2>
        <a th:href="@{/}" class="btn btn-outline-secondary rounded-pill px-4">Volver al Inicio</a>
      </div>

      <p class="text-muted mb-4">Aquí puedes consultar el histórico y el estado de tus acuerdos de asistencia personal.</p>

      <div th:if="${contratos.empty}" class="alert alert-info text-center p-4 rounded-3">
        No tienes ningún contrato registrado en el sistema actualmente.
      </div>

      <div th:if="${!contratos.empty}" class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
          <tr>
            <th>Ref. Contrato</th>
            <th>Solicitud (AP)</th>
            <th>Tipo asistencia</th>
            <th>Con</th>
            <th>Fecha Inicio</th>
            <th>Fecha Fin</th>
            <th>Estado</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="c : ${contratos}">
            <td class="fw-bold text-primary">#<span th:text="${c.id}"></span></td>
            <td>
              <a th:href="@{/Solicitudes/detail/{id}(id=${c.idSolicitud})}"
                 class="text-decoration-none">
                Solicitud #<span th:text="${c.idSolicitud}"></span>
              </a>
            </td>
            <td>
              <span th:text="${tipoAsistenciaPorSolicitud != null and tipoAsistenciaPorSolicitud.containsKey(c.idSolicitud)
                              ? tipoAsistenciaPorSolicitud.get(c.idSolicitud)
                              : '—'}">—</span>
            </td>
            <td>
              <th:block th:with="idOtra=${c.idUsuarioOvi == miId ? c.idPapPati : c.idUsuarioOvi}">
                <span th:text="${nombresPersona != null and nombresPersona.containsKey(idOtra)
                                ? nombresPersona.get(idOtra)
                                : 'Persona #' + idOtra}">—</span>
                <small class="text-muted d-block"
                       th:text="${c.idUsuarioOvi == miId ? '(PAP/PATI)' : '(Usuario OVI)'}"></small>
              </th:block>
            </td>
            <td th:text="${c.fechaInicio}"></td>
            <td th:text="${c.fechaFin != null ? c.fechaFin : 'Indefinido'}"></td>
            <td>
              <span class="badge rounded-pill px-3 py-2"
                    th:text="${c.estado}"
                    th:classappend="${c.estado == 'Activo' ? 'bg-success' : 'bg-secondary'}">
              </span>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

</body>
</html>
