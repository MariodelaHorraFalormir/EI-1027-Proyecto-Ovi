<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Contrato - OVI UJI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/navbar :: main-nav}"></nav>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white text-center py-3">
          <h4 class="mb-0">✏️ Editar Contrato #<span th:text="${contrato.id}"></span></h4>
          <small>Modifica las condiciones del acuerdo</small>
        </div>

        <div class="card-body p-4">
          <form th:action="@{/contrato/editar/{id}(id=${contrato.id})}" th:object="${contrato}" method="post">

            <div class="alert alert-info" role="alert">
              <strong>Detalles del acuerdo:</strong><br>
              Solicitud Original ID: <span th:text="*{idSolicitud}"></span><br>
              ID Usuario OVI: <span th:text="*{idUsuarioOvi}"></span> | ID Asistente: <span th:text="*{idPapPati}"></span>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label for="fechaInicio" class="form-label fw-bold">Fecha de Inicio</label>
                <input type="date" id="fechaInicio" class="form-control" th:field="*{fechaInicio}" required>
              </div>
              <div class="col-md-6">
                <label for="fechaFin" class="form-label fw-bold">Fecha de Fin (Opcional)</label>
                <input type="date" id="fechaFin" class="form-control" th:field="*{fechaFin}">
              </div>
            </div>

            <div class="mb-4">
              <label for="estado" class="form-label fw-bold">Estado del Contrato</label>
              <select id="estado" class="form-select" th:field="*{estado}">
                <option value="Activo">Activo (En vigor)</option>
                <option value="Suspendido">Suspendido (Pausado temporalmente)</option>
                <option value="Finalizado">Finalizado (Terminado)</option>
              </select>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
              <a th:href="@{/contrato/mis-contratos}" class="btn btn-outline-secondary px-4">Cancelar</a>
              <button type="submit" class="btn btn-primary px-4">Guardar Cambios</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
