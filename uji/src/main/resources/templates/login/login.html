<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - OVI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>

    <style>
        body {
            background: linear-gradient(135deg, #f4f7fb, #e9f0f8);
            min-height: 100vh;
        }

        .login-card {
            max-width: 850px;
            margin: 60px auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
            padding: 2.2rem;
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            color: #1f3b5b;
            margin-bottom: 0.4rem;
        }

        .subtitle {
            color: #6c757d;
            margin-bottom: 1.8rem;
        }

        .block-card {
            background: #f8fafc;
            border: 1px solid #e9eef5;
            border-radius: 18px;
            padding: 1.6rem;
        }

        .login-badge {
            display: inline-block;
            background: #1f4e79;
            color: white;
            font-weight: 600;
            border-radius: 999px;
            padding: 0.45rem 0.9rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .data-label {
            font-weight: 600;
            color: #1f3b5b;
            margin-bottom: 0.45rem;
        }

        .form-control {
            border-radius: 12px;
            padding: 0.75rem 0.95rem;
            border: 1px solid #d8e0ea;
            background-color: #fff;
        }

        .form-control:focus {
            border-color: #7aa7d9;
            box-shadow: 0 0 0 0.2rem rgba(58, 123, 213, 0.12);
        }

        .field-error {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 0.4rem;
        }

        .actions {
            margin-top: 1.8rem;
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .btn {
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            font-weight: 600;
        }

        .btn-primary {
            background-color: #1f4e79;
            border-color: #1f4e79;
        }

        .btn-primary:hover {
            background-color: #193f63;
            border-color: #193f63;
        }
    </style>
</head>

<body>
<div th:replace="~{layout/navbar :: main-nav}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<div class="container">
    <div class="login-card">

        <span class="login-badge">Área privada</span>

        <h1 class="title">Iniciar sesión</h1>

        <p class="subtitle">
            Introduce tu correo y contraseña para acceder a tu cuenta.
        </p>

        <div class="block-card">
            <form th:action="@{/login}" th:object="${login}" method="post">

                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="data-label" for="mail">Correo electrónico</label>

                        <input type="email" id="mail" class="form-control" th:field="*{mail}" placeholder="correo@ejemplo.com">

                        <div class="field-error" th:if="${#fields.hasErrors('mail')}" th:errors="*{mail}">Error en el correo</div>
                    </div>

                    <div class="col-md-6">
                        <label class="data-label" for="contrasena">Contraseña</label>

                        <input type="password" id="contrasena" class="form-control" th:field="*{contrasena}" placeholder="Introduce tu contraseña">

                        <div class="field-error" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}">Error en la contraseña</div>
                    </div>
                </div>

                <div class="alert alert-danger mt-4" th:if="${mensajeError != null}" th:text="${mensajeError}">
                    Correo o contraseña incorrectos.
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">Entrar</button>
                    <a class="btn btn-secondary" th:href="@{/Persona/registro}">Crear cuenta</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
